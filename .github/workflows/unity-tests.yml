name: Unity tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unity-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity Personal CI credentials
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Set UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets for the free Unity Personal test runner."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Compile and run EditMode tests
        id: editmode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: editmode-results
      - name: Run PlayMode tests
        id: playmode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: playmode-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: |
            ${{ steps.editmode.outputs.artifactsPath }}
            ${{ steps.playmode.outputs.artifactsPath }}
          if-no-files-found: ignore